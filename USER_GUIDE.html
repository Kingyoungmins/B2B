  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nospace; font-size:12px; line-height:1.55; margin-bottom:11px; white-space:pre-wrap;\">\uc218\uc815\ub41c \ucf54\ub4dc\uac00 \uc0dd\uc131\ub418\uba74 \uae30\uc874 Step 3\uc744 \uad50\uccb4\ud569\ub2c8\ub2e4.<\/div>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; align-items:center;\">\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border-radius:8px; padding:6px 11px; background:linear-gradient(135deg,var(--accent,#e6007e),var(--accent-deep,#9b1f8f)); color:#fff; font-size:12px; font-weight:700;\">\u2713 \uc218\uc815 \uc801\uc6a9<\/span>\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border:1px solid #fbd0cb; border-radius:8px; padding:6px 11px; background:#fff6f5; color:#c0392b; font-size:12px; font-weight:700;\">\u2715 \uac70\uc808<\/span>\n            <\/div>\n          <\/div>\n          <p style=\"margin:12px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\"><b>\uc218\uc815 \uc801\uc6a9<\/b>\uc740 \uae30\uc874 \ub2e8\uacc4\ub97c \uc0c8 \ucf54\ub4dc\ub85c \uad50\uccb4\ud569\ub2c8\ub2e4. \uc0c8 \ub2e8\uacc4\uac00 \ucd94\uac00\ub418\ub294 \uac83\uc774 \uc544\ub2d9\ub2c8\ub2e4.<\/p>\n          <p style=\"margin:8px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\">\uc218\uc815 \ubaa8\ub4dc\ub97c \ub05d\ub0b4\ub824\uba74 \ucc44\ud305 \uc785\ub825\ucc3d \uc704\uc758 <b>\ud574\uc81c<\/b>\ub97c \ub204\ub985\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n\n      <div style=\"display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:16px;\">\n        <div style=\"background:#fff; border:1px solid #ece8f1; border-radius:16px; padding:18px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; color:#857e90; font-size:12px; font-weight:700; margin-bottom:12px;\"><span>\uc624\ub958 \ubcf5\uad6c \ud328\ub110<\/span><span style=\"color:#bcb5c6;\">\uc2e4\ud589 \uc2e4\ud328 \uc2dc \ud45c\uc2dc<\/span><\/div>\n          <div style=\"border:1px solid #f3c98c; border-radius:12px; background:#fffaf0; padding:13px;\">\n            <strong style=\"display:block; color:#1a1320; font-size:14px;\">\uc2a4\ud0ac\uc744 \uc801\uc6a9\ud558\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4<\/strong>\n            <p style=\"margin:6px 0 0; color:#7a5a1a; font-size:13px;\">Step 2 \u00b7 \uac00\uc785\ubc88\ud638 \uae30\uc900\uc73c\ub85c \uc694\uae08 \ud569\uc0b0<\/p>\n            <div style=\"min-height:46px; border:1px solid #f3c98c; border-radius:9px; background:#fff; color:#8a5a00; padding:10px; font-size:12px; margin:11px 0;\">\ud558\ub824\ub358 \uc791\uc5c5, \uc2e4\uc81c \uacb0\uacfc, \uae30\ub300 \uacb0\uacfc\ub97c \uc801\uc73c\uba74 \ubcf5\uad6c\uac00 \ub354 \uc815\ud655\ud574\uc9d1\ub2c8\ub2e4.<\/div>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; align-items:center;\">\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border-radius:8px; padding:6px 11px; background:linear-gradient(135deg,var(--accent,#e6007e),var(--accent-deep,#9b1f8f)); color:#fff; font-size:12px; font-weight:700;\">\uc5d0\ub7ec \ubcf5\uad6c \uc2dc\ub3c4<\/span>\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border:1px solid #e2dceb; border-radius:8px; padding:6px 11px; background:#fff; color:#3a3346; font-size:12px; font-weight:700;\">\uc0c1\uc138 \uc624\ub958 \ubcf4\uae30<\/span>\n            <\/div>\n          <\/div>\n          <p style=\"margin:12px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\">\ud14d\uc2a4\ud2b8\uce78\uc5d0\ub294 \uc0ac\uc6a9\uc790\uac00 \uae30\ub300\ud55c \uacb0\uacfc\ub97c \uc9e7\uac8c \uc801\uc2b5\ub2c8\ub2e4. \uc608: \u201cH141\uc740 \ud569\uacc4 \uc218\uc2dd\uc774\ub77c \uac74\ub4dc\ub9ac\uc9c0 \ub9d0\uace0 H2:H140\ub9cc \ucc44\uc6cc\uc918.\u201d<\/p>\n          <p style=\"margin:8px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\"><b>\uc5d0\ub7ec \ubcf5\uad6c \uc2dc\ub3c4<\/b>\ub294 \uc2e4\ud328\ud55c \ub2e8\uacc4\ub97c \ud604\uc7ac \ud30c\uc77c \uad6c\uc870\uc640 \uc0ac\uc6a9\uc790\uc758 \ucd94\uac00 \uc124\uba85 \uae30\uc900\uc73c\ub85c \ub2e4\uc2dc \uace0\uce69\ub2c8\ub2e4.<\/p>\n          <p style=\"margin:8px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\">\uc2a4\ud0ac \uc2e4\ud589\uae30\uc5d0\uc11c \uc624\ub958\uac00 \ub09c \uacbd\uc6b0\uc5d0\ub294 <b>\uc0dd\uc131\uae30\uc5d0\uc11c \ubcf4\uae30<\/b> \ubc84\ud2bc\uc774 \ud568\uaed8 \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ub204\ub974\uba74 \uc0dd\uc131\uae30 \ud654\uba74\uc5d0\uc11c \uac19\uc740 \uc2a4\ud0ac\uc744 \ubcf4\uace0 \uc218\uc815\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.<\/p>\n        <\/div>\n\n        <div style=\"background:#fff; border:1px solid #ece8f1; border-radius:16px; padding:18px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; color:#857e90; font-size:12px; font-weight:700; margin-bottom:12px;\"><span>\uc694\uccad \uc911\ub2e8 / \uc0dd\uac01 \uc911\ub2e8<\/span><span style=\"color:#bcb5c6;\">\uc751\ub2f5 \uc0dd\uc131 \uc911 \ud45c\uc2dc<\/span><\/div>\n          <div style=\"border:1px solid #efe2f5; border-radius:12px; background:#fcf8ff; padding:13px;\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; align-items:center;\">\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border:1px solid #e2dceb; border-radius:8px; padding:6px 11px; background:#fff; color:#3a3346; font-size:12px; font-weight:700;\">\uc0dd\uac01 \ud3bc\uce58\uae30<\/span>\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border:1px solid #e2dceb; border-radius:8px; padding:6px 11px; background:#fff; color:#3a3346; font-size:12px; font-weight:700;\">\uc0dd\uac01 \uc911\ub2e8<\/span>\n              <span style=\"display:inline-flex; align-items:center; min-height:30px; border:1px solid #fbd0cb; border-radius:8px; padding:6px 11px; background:#fff6f5; color:#c0392b; font-size:12px; font-weight:700;\">\uc694\uccad \uc911\ub2e8<\/span>\n            <\/div>\n          <\/div>\n          <p style=\"margin:12px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\"><b>\uc0dd\uac01 \ud3bc\uce58\uae30<\/b>\ub294 AI\uac00 \uc5b4\ub5a4 \ubc29\ud5a5\uc73c\ub85c \uc791\uc5c5\uc744 \ud574\uc11d\ud588\ub294\uc9c0 \ud655\uc778\ud558\ub294 \ubcf4\uc870 \ubcf4\uae30\uc785\ub2c8\ub2e4.<\/p>\n          <p style=\"margin:8px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\"><b>\uc0dd\uac01 \uc911\ub2e8<\/b>\uc740 \uae34 \ucd94\ub860\uc744 \uba48\ucd94\uace0 \ubc14\ub85c \ub2f5\ubcc0\uc744 \ubc1b\uc2b5\ub2c8\ub2e4. <b>\uc694\uccad \uc911\ub2e8<\/b>\uc740 \ud604\uc7ac \uc0dd\uc131 \uc790\uccb4\ub97c \ucde8\uc18c\ud569\ub2c8\ub2e4.<\/p>\n          <p style=\"margin:8px 0 0; color:#5b5468; font-size:13.5px; line-height:1.6;\">\uc791\uc5c5 \uc801\uc6a9 \uc911\uc5d0\ub294 \ubcc4\ub3c4\uc758 \uc791\uc5c5 \uc911\ub2e8 \ubc84\ud2bc\uc774 \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ud070 \ud30c\uc77c \uc791\uc5c5\uc774 \ub108\ubb34 \uc624\ub798 \uac78\ub9b4 \ub54c \uc0ac\uc6a9\ud569\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"capture\" style=\"scroll-margin-top:84px; margin-top:56px;\">\n      <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:8px;\"><span style=\"width:18px; height:2px; background:var(--accent,#e6007e); border-radius:2px;\"><\/span><span style=\"font-size:12px; font-weight:800; letter-spacing:0.06em; color:var(--accent,#e6007e);\">\ucea1\ucc98<\/span><\/div>\n      <h2 style=\"font-size:26px; line-height:1.25; margin:0 0 10px; font-weight:800; letter-spacing:-0.025em;\">\ubcf5\ubd99 \ucea1\ucc98<\/h2>\n      <p style=\"max-width:820px; color:#6f6878; margin:0 0 22px; font-size:15px;\">\uc774 \ubc84\ud2bc\uc740 AI\uac00 \ucf54\ub4dc\ub97c \ucd94\uce21\ud558\uc9c0 \uc54a\uace0, \uc0ac\uc6a9\uc790\uac00 \uc2e4\uc81c Excel\uc5d0\uc11c \ud55c \ubcf5\uc0ac/\ubd99\uc5ec\ub123\uae30 \ud589\ub3d9\uc744 \uc2a4\ud0ac \ub2e8\uacc4\ub85c \uc800\uc7a5\ud558\ub294 \uae30\ub2a5\uc785\ub2c8\ub2e4.<\/p>\n      <div style=\"display:grid; grid-template-columns:repeat(1,minmax(0,1fr)); gap:16px;\">\n        <div style=\"background:#fff; border:1px solid #ece8f1; border-radius:16px; padding:20px; box-shadow:0 1px 2px rgba(20,10,25,0.04);\">\n          <span style=\"display:inline-flex; align-items:center; border-radius:999px; padding:4px 11px; background:#fde7f3; color:#b30063; font-size:12px; font-weight:800; margin-bottom:12px;\">\ubcf5\ubd99 \ucea1\ucc98<\/span>\n          <h3 style=\"font-size:16px; margin:0 0 8px; font-weight:700;\">Excel\uc5d0\uc11c \uc9c1\uc811 \ubcf5\uc0ac\ud558\uace0 \ubd99\uc5ec\ub123\uc740 \uc791\uc5c5\uc744 \uc800\uc7a5<\/h3>\n          <p style=\"margin:0 0 12px; color:#5b5468; font-size:13.5px; line-height:1.6;\">\uc624\ub978\ucabd Excel\uc5d0\uc11c <b>Ctrl+C \u2192 Ctrl+V<\/b>\ub85c \ubcf5\ubd99\ud55c \uc9c1\ud6c4 \ub204\ub985\ub2c8\ub2e4. \uac12, \uc218\uc2dd, \uc11c\uc2dd, \ubcd1\ud569 \uc0c1\ud0dc\ub97c Excel \ubcf5\uc0ac \ubc29\uc2dd \uadf8\ub300\ub85c \uc7ac\ud604\ud569\ub2c8\ub2e4.<\/p>\n          <div style=\"background:#1a1226; color:#ece4f2; border-radius:12px; padding:14px 16px; font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:13px; line-height:1.6; white-space:pre-wrap;\">\uc0ac\uc6a9 \uc21c\uc11c\n1. \uc624\ub978\ucabd Excel\uc5d0\uc11c \uc6d0\ubcf8 \ubc94\uc704 \uc120\ud0dd \ud6c4 Ctrl+C\n2. \ubd99\uc5ec\ub123\uc744 \uc704\uce58 \uc120\ud0dd \ud6c4 Ctrl+V\n3. \uc67c\ucabd \uc544\ub798\uc758 \u201c\ubcf5\ubd99 \ucea1\ucc98\u201d \ud074\ub9ad\n4. \uc2a4\ud0ac \ud30c\uc774\ud504\ub77c\uc778\uc5d0 \ubcf5\ubd99 \ub2e8\uacc4\uac00 \uc800\uc7a5\ub428<\/div>\n        <\/div>\n      <\/div>\n      <div style=\"background:#fff; border-left:4px solid var(--accent,#e6007e); border-radius:12px; padding:15px 18px; margin:16px 0 0; box-shadow:0 1px 2px rgba(20,10,25,0. lay:block; min-height:148px; background:#fff; border:1px solid #ece8f1; border-radius:16px; padding:20px; color:inherit; text-decoration:none; transition:border-color .15s,transform .15s,box-shadow .15s;\" style-hover=\"border-color:rgba(230,0,126,0.34); transform:translateY(-2px); box-shadow:0 14px 30px rgba(20,10,25,0.10);\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:16px; font-weight:800; margin-bottom:8px;\"><span>{{ q.title }}<\/span><span style=\"color:var(--accent,#e6007e); font-size:17px;\">\u2197<\/span><\/div>\n            <p style=\"margin:0; color:#5b5468; font-size:13.5px; line-height:1.6;\">{{ q.desc }}<\/p>\n          <\/a>\n        <\/sc-for>\n      <\/div>\n      <div style=\"background:#fff; border-left:4px solid var(--accent,#e6007e); border-radius:12px; padding:15px 18px; margin:16px 0 0; box-shadow:0 1px 2px rgba(20,10,25,0.04);\">\n        <strong style=\"display:block; margin-bottom:4px; font-weight:700;\">\uc81c\ubcf4\ud560 \ub54c \uac19\uc774 \uc801\uc73c\uba74 \uc88b\uc740 \ub0b4\uc6a9<\/strong>\n        <span style=\"color:#5b5468; font-size:14px;\">\uc5b4\ub5a4 \ud30c\uc77c\uc5d0\uc11c, \uc5b4\ub5a4 \uc694\uccad\uc744 \ud588\uace0, \uc2e4\uc81c \uacb0\uacfc\uc640 \uae30\ub300 \uacb0\uacfc\uac00 \uc5b4\ub5bb\uac8c \ub2ec\ub790\ub294\uc9c0 \uc801\uc73c\uba74 \uc7ac\ud604\uacfc \uc218\uc815\uc774 \ube68\ub77c\uc9d1\ub2c8\ub2e4.<\/span>\n      <\/div>\n    <\/section>\n\n    <div style=\"margin-top:48px; padding-top:22px; border-top:1px solid #ece8f1; color:#a59eb0; font-size:12.5px;\">\n      B2B \ube4c\ub9c1 Agent 0.5.11 \uc0ac\uc6a9\uc790 \uac00\uc774\ub4dc. \uba54\ub274\uc758 \u201c\uc0ac\uc6a9 \uac00\uc774\ub4dc\u201d\uc5d0\uc11c \ub2e4\uc2dc \uc5f4 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\n    <\/div>\n  <\/main>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e6007e&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accentDeep&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9b1f8f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heroStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;\ub525 \ud50c\ub7fc&quot;,&quot;options&quot;:[&quot;\ub525 \ud50c\ub7fc&quot;,&quot;\ub9c8\uc820\ud0c0&quot;,&quot;\uc789\ud06c&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const heroMap = {\n      \"\ub525 \ud50c\ub7fc\": \"linear-gradient(135deg,#23091f 0%,#7d0654 58%,#c2006e 100%)\",\n      \"\ub9c8\uc820\ud0c0\": \"linear-gradient(135deg,#a8005c 0%,#e6007e 100%)\",\n      \"\uc789\ud06c\": \"linear-gradient(135deg,#171320 0%,#2a2440 100%)\"\n    };\n    const accent = this.props.accent ?? \"#e6007e\";\n    const heroStyle = this.props.heroStyle ?? \"\ub525 \ud50c\ub7fc\";\n    return {\n      accent,\n      accentDeep: this.props.accentDeep ?? \"#9b1f8f\",\n      heroBg: heroMap[heroStyle] ?? heroMap[\"\ub525 \ud50c\ub7fc\"],\n      legend: [\n        { no: \"1\", title: \"\uc785\ub825 \ud30c\uc77c\", desc: \"\ub85c\uc6b0\ub370\uc774\ud130, \ub300\uc0ac \uc790\ub8cc, \uc6d0\ubcf8 \ud30c\uc77c\uc744 \uc62c\ub9bd\ub2c8\ub2e4.\" },\n        { no: \"2\", title: \"\ucd9c\ub825 \ud15c\ud50c\ub9bf\", desc: \"\uacb0\uacfc\ub97c \ucc44\uc6cc \ub123\uc744 \uc591\uc2dd\uc744 \uc62c\ub9bd\ub2c8\ub2e4.\" },\n        { no: \"3\", title: \"\uc2a4\ud0ac \uc124\uacc4\", desc: \"AI\uc5d0\uac8c \uc791\uc5c5\uc744 \ub9d0\ub85c \uc694\uccad\ud569\ub2c8\ub2e4.\" },\n        { no: \"4\", title: \"\uc804\uccb4 \uc2e4\ud589\", desc: \"\ucf1c\uc9c4 \uc2a4\ud0ac \ub2e8\uacc4\ub97c \uc21c\uc11c\ub300\ub85c \ubaa8\ub450 \uc2e4\ud589\ud569\ub2c8\ub2e4.\" },\n        { no: \"5\", title: \"Undo\", desc: \"\ubc29\uae08 \uc801\uc6a9\ud55c \uc791\uc5c5\uc744 \ub418\ub3cc\ub9bd\ub2c8\ub2e4.\" },\n        { no: \"6\", title: \"Redo\", desc: \"\ub418\ub3cc\ub9b0 \uc791\uc5c5\uc744 \ub2e4\uc2dc \uc801\uc6a9\ud569\ub2c8\ub2e4.\" },\n        { no: \"7\", title: \"\uc804\uccb4 \ud30c\uc77c \ub2e4\uc6b4\ub85c\ub4dc\", desc: \"\uc791\uc5c5 \uacb0\uacfc \ud30c\uc77c\uc744 \ub0b4\ub824\ubc1b\uc2b5\ub2c8\ub2e4.\" },\n        { no: \"8\", title: \"\uc2a4\ud0ac \uc800\uc7a5\", desc: \"\ud604\uc7ac \ud30c\uc774\ud504\ub77c\uc778\uc744 zip\uc73c\ub85c \uc800\uc7a5\ud569\ub2c8\ub2e4.\" },\n        { no: \"9\", title: \"\uc2a4\ud0ac \ubd88\ub7ec\uc624\uae30\", desc: \"\uc800\uc7a5\ub41c zip \uc2a4\ud0ac\uc744 \ubd88\ub7ec\uc635\ub2c8\ub2e4.\" },\n        { no: \"10\", title: \"\ucd08\uae30\ud654\", desc: \"\ud604\uc7ac \uc791\uc5c5 \uc0c1\ud0dc\ub97c \uc815\ub9ac\ud569\ub2c8\ub2e4.\" },\n        { no: \"11\", title: \"\ubcf5\ubd99 \ucea1\ucc98\", desc: \"\uc9c1\uc811 \ud55c \ubcf5\uc0ac/\ubd99\uc5ec\ub123\uae30\ub97c \uc2a4\ud0ac\ub85c \uc800\uc7a5\ud569\ub2c8\ub2e4.\" }\n      ],\n      buttons: [\n        { num: \"4\", name: \"\uc804\uccb4 \uc2e4\ud589\", primary: true, normal: false, desc: \"\ucf1c\uc838 \uc788\ub294 \uc2a4\ud0ac \ub2e8\uacc4\ub97c \uc704\uc5d0\uc11c \uc544\ub798\ub85c \uc21c\uc11c\ub300\ub85c \uc2e4\ud589\ud569\ub2c8\ub2e4. \uc800\uc7a5\ub41c \uc2a4\ud0ac\uc744 \uc0c8 \ud30c\uc77c\uc5d0 \ub2e4\uc2dc \uc801\uc6a9\ud560 \ub54c \uc0ac\uc6a9\ud569\ub2c8\ub2e4.\" },\n        { num: \"5\", name: \"Undo\", primary: false, normal: true, desc: \"\ubc29\uae08 \uc801\uc6a9\ud55c \uc791\uc5c5\uc744 \ub418\ub3cc\ub9bd\ub2c8\ub2e4. \ud070 \uc791\uc5c5 \ud6c4\uc5d0\ub294 \uacb0\uacfc\ub97c \ub208\uc73c\ub85c \ud655\uc778\ud55c \ub4a4 \uc0ac\uc6a9\ud558\uc138\uc694.\" },\n        { num: \"6\", name: \"Redo\", primary: false, normal: true, desc: \"Undo\ub85c \ub418\ub3cc\ub9b0 \uc791\uc5c5\uc744 \ub2e4\uc2dc \uc801\uc6a9\ud569\ub2c8\ub2e4.\" },\n        { num: \"7\", name: \"\uc804\uccb4 \ud30c\uc77c \ub2e4\uc6b4\ub85c\ub4dc\", primary: true, normal: false, desc: \"\uc791\uc5c5\uc774 \ub05d\ub09c \uc785\ub825 \ud30c\uc77c\uacfc \ucd9c\ub825 \ud15c\ud50c\ub9bf\uc744 \ub0b4\ub824\ubc1b\uc2b5\ub2c8\ub2e4. \uacb0\uacfc \uac80\uc218 \ud6c4 \ub2e4\uc6b4\ub85c\ub4dc\ud558\uc138\uc694.\" },\n        { num: \"8\", name: \"\uc2a4\ud0ac \uc800\uc7a5\", primary: false, normal: true, desc: \"\ud604\uc7ac \ud30c\uc774\ud504\ub77c\uc778\uc744 zip\uc73c\ub85c \uc800\uc7a5\ud569\ub2c8\ub2e4. \ud30c\uc77c\uba85\uc740 \uc791\uc5c5 \ud30c\uc77c\uba85\uacfc \uc800\uc7a5 \uc2dc\uac01\uc744 \uae30\uc900\uc73c\ub85c \ub9cc\ub4e4\uc5b4\uc9d1\ub2c8\ub2e4.\" },\n        { num: \"9\", name: \"\uc2a4\ud0ac \ubd88\ub7ec\uc624\uae30\", primary: false, normal: true, desc: \"\uc800\uc7a5\ud574 \ub454 zip \uc2a4\ud0ac\uc744 \ubd88\ub7ec\uc635\ub2c8\ub2e4. \ubd88\ub7ec\uc628 \ub4a4\uc5d0\ub294 \ud30c\uc77c\uc744 \uc62c\ub9ac\uace0 \uc804\uccb4 \uc2e4\ud589\uc744 \ub204\ub985\ub2c8\ub2e4.\" },\n        { num: \"10\", name: \"\ucd08\uae30\ud654\", primary: false, normal: true, desc: \"\ud604\uc7ac \uc791\uc5c5 \uc0c1\ud0dc\ub97c \uc815\ub9ac\ud558\uace0 \uc0c8 \uc791\uc5c5\uc744 \uc2dc\uc791\ud569\ub2c8\ub2e4. Excel \ucc3d\uc774 \uaf2c\uc600\uac70\ub098 \uc624\ub798 \ucf1c \ub454 \uacbd\uc6b0\uc5d0\ub3c4 \uc720\uc6a9\ud569\ub2c8\ub2e4.\" },\n        { num: \"11\", name: \"\ubcf5\ubd99 \ucea1\ucc98\", primary: false, normal: true, desc: \"\uc624\ub978\ucabd Excel\uc5d0\uc11c \uc9c1\uc811 \ud55c \ubcf5\uc0ac/\ubd99\uc5ec\ub123\uae30\ub97c \uc2a4\ud0ac \ub2e8\uacc4\ub85c \uc800\uc7a5\ud569\ub2c8\ub2e4.\" }\n      ],\n      troubles: [\n        { s: \"\uc5c9\ub6b1\ud55c \uc2dc\ud2b8\ub098 \uc140\uc5d0 \uac12\uc774 \ub4e4\uc5b4\uac10\", c: \"\uc694\uccad\uc5d0 \ud30c\uc77c\uba85, \uc2dc\ud2b8\uba85, \ubc94\uc704\uac00 \ubd80\uc871\ud588\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\", f: \"\uc624\ub978\ucabd Excel\uc5d0\uc11c \ubc94\uc704\ub97c \ub2e4\uc2dc \uc120\ud0dd\ud55c \ub4a4 \uc120\ud0dd \ubc94\uc704\ub97c \ud3ec\ud568\ud574 \uc694\uccad\ud569\ub2c8\ub2e4.\" },\n        { s: \"\ud569\uacc4\ud589 \uc218\uc2dd\uc774 \uac12\uc73c\ub85c \ubc14\ub01c\", c: \"\ub300\uc0c1 \ubc94\uc704\uc5d0 \ud569\uacc4\ud589\uc774 \ud3ec\ud568\ub418\uc5b4 \uc788\uc5c8\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\", f: \"\u201c\ud569\uacc4\ud589\uc740 \uc81c\uc678\ud558\uace0\u201d, \u201cH2:H140\ub9cc\u201d\ucc98\ub7fc \ubc94\uc704\ub97c \uc881\ud600 \uc694\uccad\ud569\ub2c8\ub2e4.\" },\n        { s: \"\uc55e\uc790\ub9ac 0\uc774 \uc0ac\ub77c\uc9d0\", c: \"\uac00\uc785\ubc88\ud638, \uc804\ud654\ubc88\ud638\uac00 \uc22b\uc790\ub85c \ucc98\ub9ac\ub418\uc5c8\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\", f: \"\u201c\uac00\uc785\ubc88\ud638\ub294 \ud14d\uc2a4\ud2b8\ub85c \uc720\uc9c0\u201d, \u201c\uc55e\uc790\ub9ac 0 \ubcf4\uc874\u201d\uc774\ub77c\uace0 \uc694\uccad\uc5d0 \ub123\uc2b5\ub2c8\ub2e4.\" },\n        { s: \"\uc74c\uc218\uac00 \uc591\uc218\ucc98\ub7fc \uacc4\uc0b0\ub428\", c: \"\uae08\uc561 \ubb38\uc790\uc5f4\uc744 \uc815\ub9ac\ud558\uba74\uc11c \ubd80\ud638\uac00 \ube60\uc84c\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\", f: \"\u201c\uc74c\uc218 \ubd80\ud638\ub97c \uc720\uc9c0\ud574\uc11c \ud569\uc0b0\u201d\uc774\ub77c\uace0 \uc801\uace0 \ub2e4\uc2dc \uc0dd\uc131\ud569\ub2c8\ub2e4.\" },\n        { s: \"\ud504\ub85c\uadf8\ub7a8\uc774 \uc624\ub798 \uba48\ucd98 \uac83\ucc98\ub7fc \ubcf4\uc784\", c: \"\ud070 \ubc94\uc704 \ubc18\ubcf5, \ub2e4\uc911 \ud30c\uc77c \ub9e4\uce6d, Excel COM \uc791\uc5c5\uc774 \uc624\ub798 \uac78\ub9b4 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\", f: \"\uc791\uc5c5 \uc911\ub2e8 \ubc84\ud2bc\uc774 \ubcf4\uc774\uba74 \uc911\ub2e8\ud569\ub2c8\ub2e4. \uc624\ub798 \ucf1c \ub454 \uc0c1\ud0dc\uba74 \ucd08\uae30\ud654 \ud6c4 \ub2e4\uc2dc \uc2e4\ud589\ud569\ub2c8\ub2e4.\" },\n        { s: \"\uc804\uccb4 \uc2e4\ud589\uc5d0\uc11c \uc624\ub958\uac00 \ub0a8\", c: \"\uc800\uc7a5\ub41c \uc2a4\ud0ac\uc758 \ud30c\uc77c/\uc2dc\ud2b8/\uc5f4 \uad6c\uc870\uc640 \ud604\uc7ac \ud30c\uc77c\uc774 \ub2e4\ub97c \uc218 \uc788\uc2b5\ub2c8\ub2e4.\", f: \"\uc5d0\ub7ec \ubcf5\uad6c\ub97c \ub204\ub974\uac70\ub098, \uc0dd\uc131\uae30\uc5d0\uc11c \uac19\uc740 \uc791\uc5c5\uc744 \ud604\uc7ac \ud30c\uc77c \uae30\uc900\uc73c\ub85c \ub2e4\uc2dc \uc0dd\uc131\ud569\ub2c8\ub2e4.\" }\n      ],\n      qaCards: [\n        { title: \"LLM \uc624\ub2f5\uc0ac\ub840\", href: \"https://lgucorp.atlassian.net/jira/software/projects/SBAGENT/form/3763?atlOrigin=eyJpIjoiNDcyMzAwNTIwNjEyNGNjOWExN2VlNmVkMGUxYmVhMDMiLCJwIjoiaiJ9\", desc: \"AI\uac00 \uc694\uccad\uc744 \uc798\ubabb \uc774\ud574\ud588\uac70\ub098, \uc798\ubabb\ub41c \uc5f4/\uc2dc\ud2b8/\uc870\uac74\uc73c\ub85c \ucf54\ub4dc\ub97c \ub9cc\ub4e0 \uacbd\uc6b0\uc5d0 \uc81c\ubcf4\ud569\ub2c8\ub2e4.\" },\n        { title: \"\uae30\ub2a5 \uc624\ub958\", href: \"https://lgucorp.atlassian.net/jira/software/projects/SBAGENT/form/3764?atlOrigin=eyJpIjoiODlmMzkyMTRlNjc3NDc5Yjg5NGNkNDI3Nzc0MmJiYTgiLCJwIjoiaiJ9\", desc: \"\ubc84\ud2bc\uc774 \ub3d9\uc791\ud558\uc9c0 \uc54a\uac70\ub098, \uc804\uccb4 \uc2e4\ud589/\ubcf5\uad6c/\ucea1\ucc98/\ud30c\uc77c \uc5c5\ub85c\ub4dc\ucc98\ub7fc \ud504\ub85c\uadf8\ub7a8 \uae30\ub2a5 \uc790\uccb4\uac00 \uc2e4\ud328\ud55c \uacbd\uc6b0\uc5d0 \uc81c\ubcf4\ud569\ub2c8\ub2e4.\" },\n        { title: \"\uae30\ud0c0\", href: \"https://lgucorp.atlassian.net/jira/software/projects/SBAGENT/form/3767?atlOrigin=eyJpIjoiNThkODU3NmFiMDAxNGViNzk5MTUxNzdhYTUxMWEwNjIiLCJwIjoiaiJ9\", desc: \"\uc0ac\uc6a9\uc131 \uac1c\uc120, \uc124\uba85 \ubcf4\uac15, \ucd94\uac00 \uae30\ub2a5 \uc694\uccad\ucc98\ub7fc \uc704 \ub450 \ud56d\ubaa9\uc5d0 \ub531 \ub9de\uc9c0 \uc54a\ub294 \ub0b4\uc6a9\uc744 \uc81c\ubcf4\ud569\ub2c8\ub2e4.\" }\n      ]\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>\n"
