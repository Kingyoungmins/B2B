name = "axcell_runner"
version = "0.2.1"
description = "b2b 스킬 실행기 — 저장된 스킬(zip)을 b2b 프로그램 없이 Excel COM 으로 직접 실행"

# run_report 가 커서 기반 이벤트 테일(after_cursor/max_events/include_events)을 구현함
event_schema = "axcell_runner.run-events/v1"

[install]
windows = "ixi-flow/install.ps1"

[skills]
sources = ["skills/axcell-runner-guide"]

# $IXI_PY / $IXI_VENDOR 는 설치기가 install 훅 stdout(IXI_PY=/IXI_VENDOR=)으로 해석해 치환한다.
# ({bundle_root} 치환은 실제 설치기에 없음 — 가이드 문서와 달리 $IXI_* 어휘가 실계약.)
[mcp_servers.axcell_runner]
command = "$IXI_PY"
args = ["-m", "axcell_runner.mcp_server"]

[mcp_servers.axcell_runner.env]
PYTHONPATH = "$IXI_VENDOR"
AXCELL_RUNNER_ENGINE_DIR = "$IXI_VENDOR\\axcell_runner\\engine"
PYTHONUTF8 = "1"

[mcp_servers.axcell_runner.background_runs]
start_tools  = ["run_start"]
end_tools    = ["run_stop"]
status_tools = ["run_report"]

id_fields    = ["run_id"]
label_fields = ["skill", "title"]

progress_fields         = ["step"]
total_fields            = ["total_steps"]
progress_context_fields = ["step_label"]

poll_interval_secs  = 5
status_timeout_arg  = "max_wait_seconds"
status_timeout_secs = 0
terminal_markers = ["completed", "failed", "cancelled"]
status_errors_terminal_after = 3

event_cursor_arg  = "after_cursor"
event_limit_arg   = "max_events"
event_include_arg = "include_events"

drives_browser     = false
display_name       = "스킬 실행기"
