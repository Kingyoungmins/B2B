<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 도움</title>
<!-- [AI 도움 팝업 페이지] NativeHost 가 별도 OS 창(WebView2)으로 띄우는 순수 '화면'이다.
     스킬 상태(state.pipeline)와 LLM 호출은 전부 메인 페이지에 있고, 이 창은 C# 중계를 통해
     이벤트만 주고받는다 — 여기서 상태를 직접 만지는 코드를 절대 넣지 말 것. -->
<link rel="stylesheet" href="styles/panels.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff;
               font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  /* 팝업 창 안에서는 떠 있는 카드가 아니라 창 전체를 채운다 */
  .assist-popup {
    position: static; display: flex; width: 100%; height: 100vh;
    min-width: 0; min-height: 0; max-width: none; max-height: none;
    border: none; border-radius: 0; box-shadow: none;
  }
  .assist-head { cursor: default; }        /* 창 이동은 OS 제목줄이 담당 */
  .assist-resize { display: none; }        /* 크기 조절도 OS 창 테두리가 담당 */
  .assist-offline {
    margin: 12px; padding: 10px 12px; border: 1px solid #fdba74; background: #fff7ed;
    border-radius: 8px; font-size: 12.5px; display: none;
  }
</style>
</head>
<body>
<div class="assist-popup open">
  <div class="assist-head">
    <span class="assist-title">✦ AI 도움</span>
    <span class="assist-sub" id="assist-status"></span>
    <button type="button" class="assist-mini" id="assist-clear" title="이 대화 비우기">비우기</button>
  </div>
  <div class="assist-offline" id="assist-offline">
    메인 창과 연결되지 않았습니다. 이 페이지는 프로그램의 [✦ AI 도움] 버튼으로 열어야 동작합니다.
  </div>
  <div class="assist-messages" id="assist-messages"></div>
  <div class="assist-chips" id="assist-chips"></div>
  <div class="assist-input-row">
    <textarea id="assist-text" rows="2" placeholder="예) 3단계가 적용됐다는데 값이 안 바뀌었어 / 이 스킬 뭐 하는 거야? / 5월 파일로 바꾸려면 뭘 고쳐야 해?"></textarea>
    <button class="assist-send" id="assist-send" type="button">전송</button>
  </div>
</div>
<script src="scripts/assist-popup.js"></script>
</body>
</html>
